<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bostisthetics · Verificare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E7; --surface:#FFFFFF; --surface-2:#EFE7D6;
  --text:#16141A; --muted:#6B6252; --border:#E1D6BE;
  --accent:#C97A00; --accent-strong:#9A5D00; --accent-ink:#FFFFFF;
  --ok:#3F6B54; --ok-bg:#E4EEE6;
  --bad:#96402A; --bad-bg:#F3DDD3;
  --warn:#8A6414; --warn-bg:#F3E7C8;
  --shadow:0 1px 2px rgba(22,20,26,.06),0 6px 18px rgba(22,20,26,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16141A; --surface:#1D1A24; --surface-2:#242030;
    --text:#F3EFE6; --muted:#A79E8D; --border:#332E3D;
    --accent:#F59B00; --accent-strong:#FFB238; --accent-ink:#16141A;
    --ok:#8FCBAA; --ok-bg:#1E2B22;
    --bad:#E3806A; --bad-bg:#33201B;
    --warn:#E5B94E; --warn-bg:#332A14;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;}
html{overflow-x:hidden;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Work Sans',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;max-width:100%;
  padding:0 16px calc(40px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:620px;margin:0 auto;}
header{padding-block:26px 14px;}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent-strong);font-weight:600;}
h1{font-family:'Oswald',sans-serif;text-transform:uppercase;margin:3px 0 0;
  font-size:26px;font-weight:700;overflow-wrap:anywhere;}
.build{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:6px;}

.verdict{border-radius:12px;padding:16px;margin:16px 0 4px;
  border:1px solid var(--border);background:var(--surface-2);}
.verdict.ok{background:var(--ok-bg);border-color:var(--ok);}
.verdict.bad{background:var(--bad-bg);border-color:var(--bad);}
.verdict.warn{background:var(--warn-bg);border-color:var(--warn);}
.verdict b{display:block;font-family:'Oswald',sans-serif;text-transform:uppercase;
  font-size:18px;font-weight:600;margin-bottom:4px;overflow-wrap:anywhere;}
.verdict.ok b{color:var(--ok);} .verdict.bad b{color:var(--bad);} .verdict.warn b{color:var(--warn);}
.verdict span{font-size:14px;}

.section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 9px;}
.row{display:flex;align-items:flex-start;gap:11px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:7px;
  box-shadow:var(--shadow);}
.mark{flex:0 0 auto;width:22px;height:22px;border-radius:50%;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.mark.ok{background:var(--ok);color:var(--bg);}
.mark.bad{background:var(--bad);color:var(--bg);}
.mark.warn{background:var(--warn);color:var(--bg);}
.rt{flex:1;min-width:0;}
.rt b{display:block;font-size:14.5px;font-weight:600;overflow-wrap:anywhere;}
.rt span{display:block;font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;}

label.field{display:block;margin-bottom:11px;}
label.field span{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
input[type="text"]{width:100%;min-width:0;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:9px;padding:11px 12px;
  font-family:'IBM Plex Mono',monospace;font-size:14px;}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 12px;}

button{font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;
  padding:12px 16px;width:100%;margin-top:9px;max-width:100%;}
button.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);}

.report{margin-top:20px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:11px;padding:13px;}
.report .section-label{margin-top:0;}
pre{margin:0;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;color:var(--text);}
.foot{margin-top:24px;font-size:12.5px;color:var(--muted);
  font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Bostisthetics</div>
    <h1>Verificare bază de date</h1>
    <div class="build" id="build"></div>
  </header>

  <div class="verdict" id="verdict"><b>Se verifică…</b><span>Câteva secunde.</span></div>

  <div class="section-label">Ce foloseşte</div>
  <label class="field"><span>Adresa proiectului</span>
    <input type="text" id="url" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <label class="field"><span>Cheia publishable</span>
    <input type="text" id="key" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <div class="hint">Poţi lipi altă cheie aici şi apăsa Verifică — nu trebuie să urci alt fişier.</div>
  <button id="go">Verifică</button>
  <button class="ghost" id="reset">Revino la valorile din fişier</button>

  <div class="section-label">Rezultate</div>
  <div id="out"></div>

  <div class="report">
    <div class="section-label">De trimis lui Claude</div>
    <pre id="report">…</pre>
    <button id="copy">Copiază raportul</button>
  </div>

  <div class="foot">@bostisthetics</div>
</div>

<script>
(function(){
"use strict";

var BUILD   = "versiunea 3 · 24.09.2026";
var DEF_URL = "https://ifsdpceyorfozzeaordv.supabase.co";
var DEF_KEY = "sb_publishable_lRgu7w251_wbTdWxuf080g_UyOYK5PS";
var TABLES  = ["clients","measurements","exercises","routines","workouts","workout_sets"];

document.getElementById("build").textContent = BUILD;

var lines = [];
function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; }
function paint(){ document.getElementById("report").textContent = lines.join("\n"); }
function row(state,title,detail){
  var r=el("div","row");
  r.appendChild(el("div","mark "+state, state==="ok"?"✓":state==="bad"?"✗":"!"));
  var t=el("div","rt"); t.appendChild(el("b",null,title));
  if(detail) t.appendChild(el("span",null,detail));
  r.appendChild(t);
  document.getElementById("out").appendChild(r);
  lines.push((state==="ok"?"[OK] ":state==="bad"?"[EROARE] ":"[ATENTIE] ")+title+(detail?" — "+detail:""));
  paint();
}
function verdict(state,title,detail){
  var v=document.getElementById("verdict");
  v.className="verdict "+state; v.innerHTML="";
  v.appendChild(el("b",null,title)); v.appendChild(el("span",null,detail));
}
function get(){
  return { url: document.getElementById("url").value.trim().replace(/\/+$/,""),
           key: document.getElementById("key").value.trim() };
}
function store(){
  try{ var g=get(); localStorage.setItem("bost_url",g.url); localStorage.setItem("bost_key",g.key); }catch(e){}
}
function load(){
  var u=DEF_URL,k=DEF_KEY;
  try{ u=localStorage.getItem("bost_url")||DEF_URL; k=localStorage.getItem("bost_key")||DEF_KEY; }catch(e){}
  document.getElementById("url").value=u;
  document.getElementById("key").value=k;
}

/* cheile sb_publishable_ NU sunt JWT: merg doar pe antetul apikey,
   nu pe Authorization: Bearer (acolo sunt verificate ca JWT si respinse) */
function call(base,key,path,opts){
  opts=opts||{};
  var o={ method: opts.method||"GET", headers:{ apikey:key } };
  if(opts.body){ o.headers["Content-Type"]="application/json"; o.body=JSON.stringify(opts.body); }
  return fetch(base+path,o).then(function(r){
    return r.text().then(function(t){
      var j=null; try{ j=JSON.parse(t); }catch(e){}
      return { status:r.status, text:t, json:j };
    });
  });
}
function why(r){
  if(!r) return "";
  if(r.json && (r.json.message || r.json.msg || r.json.error_description || r.json.error))
    return String(r.json.message || r.json.msg || r.json.error_description || r.json.error);
  return (r.text||"").slice(0,160);
}

function run(){
  store();
  var g = get();
  lines = [];
  document.getElementById("out").innerHTML = "";
  verdict("", "Se verifică…", "Câteva secunde.");

  lines.push("BUILD:   " + BUILD);
  lines.push("Proiect: " + g.url);
  lines.push("Cheie:   " + g.key + "   (" + g.key.length + " caractere)");
  lines.push("");
  paint();

  if(g.key.indexOf("sb_secret_") === 0){
    row("bad","Ai pus cheia SECRETĂ","Pune cea publishable, apoi șterge-o pe asta din Supabase.");
    verdict("bad","Cheie greșită","Cheia secretă nu are voie într-o pagină web.");
    return Promise.resolve();
  }
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(g.url)){
    row("warn","Adresa proiectului arată neobișnuit", g.url);
  }

  var problems=0, warnings=0, reachable=false, keyOk=false;

  return call(g.url, g.key, "/auth/v1/settings").then(function(r){
    reachable = true;
    if(r.status === 200 && r.json){
      keyOk = true;
      row("ok","Serverul acceptă cheia","Setările de cont s-au citit (cod 200).");
      if(r.json.disable_signup){ problems++; row("bad","Înscrierea e oprită","Clienții nu-și pot face cont."); }
      else row("ok","Clienții își pot face cont","Înscrierea cu e-mail e pornită.");
      if(r.json.mailer_autoconfirm) row("ok","Contul se activează pe loc","Fără e-mail de confirmare.");
      else { warnings++; row("warn","Se cere confirmare pe e-mail","Pe planul gratuit Supabase trimite puține e-mailuri pe oră."); }
    } else {
      problems++;
      row("bad","Serverul refuză cheia (cod " + r.status + ")", why(r) || "fără detalii");
    }
  }).catch(function(e){
    problems++;
    row("bad","Nu se poate ajunge la server", String(e && e.message || e));
  }).then(function(){

    if(!reachable) return;
    var seq = Promise.resolve();
    TABLES.forEach(function(t){
      seq = seq.then(function(){
        return call(g.url, g.key, "/rest/v1/" + t + "?select=*&limit=1").then(function(r){
          if(r.status === 200){
            row("ok", t, "există; cu cheia publică nu se vede nimic din ea, cum trebuie");
          } else if(r.status === 401 || r.status === 403){
            problems++; row("bad", t, "cheia respinsă de Data API (cod " + r.status + ") — " + why(r));
          } else if(r.status === 404 || (r.json && r.json.code === "PGRST205")){
            problems++; row("bad", t, "tabelul lipsește — " + why(r));
          } else {
            problems++; row("bad", t, "cod " + r.status + " — " + why(r));
          }
        }).catch(function(e){ problems++; row("bad", t, String(e && e.message || e)); });
      });
    });
    return seq;

  }).then(function(){

    if(!reachable || !keyOk) return;
    return call(g.url, g.key, "/rest/v1/clients", { method:"POST",
      body:{ name:"TEST VERIFICARE", start_date:"2020-01-01",
             coach_id:"00000000-0000-0000-0000-000000000000" } }).then(function(r){
      if(r.status === 401 || r.status === 403 ||
         (r.json && (r.json.code === "42501" || /row-level security/i.test(r.json.message||"")))){
        row("ok","Scrierea fără cont e blocată","Nimeni nu poate băga date fără să fie logat.");
      } else if(r.status === 200 || r.status === 201){
        problems++;
        row("bad","ATENȚIE: scrierea fără cont a reușit","Regulile de securitate nu sunt active. Nu da linkul nimănui.");
      } else {
        warnings++; row("warn","Test de securitate neconcludent","cod " + r.status + " — " + why(r));
      }
    }).catch(function(e){ warnings++; row("warn","Testul de securitate nu a rulat", String(e&&e.message||e)); });

  }).then(function(){
    if(!reachable){
      verdict("bad","Nu am ajuns la server","Verifică adresa proiectului. Trimite raportul.");
      lines.unshift("REZULTAT: serverul nu răspunde\n");
    } else if(!keyOk){
      verdict("bad","Cheia nu e acceptată","Mesajul exact al serverului e în raport. Trimite-l.");
      lines.unshift("REZULTAT: cheia respinsă\n");
    } else if(problems > 0){
      verdict("bad","Ceva nu e în regulă", problems + " de reparat. Trimite raportul.");
      lines.unshift("REZULTAT: " + problems + " probleme, " + warnings + " atenționări\n");
    } else if(warnings > 0){
      verdict("warn","Merge, cu observații","Baza de date e bună. " + warnings + " de reglat.");
      lines.unshift("REZULTAT: esențialul OK, " + warnings + " atenționări\n");
    } else {
      verdict("ok","Totul e pregătit","Baza de date, securitatea și conturile sunt în regulă.");
      lines.unshift("REZULTAT: totul OK\n");
    }
    paint();
  });
}

document.getElementById("go").onclick = function(){ run(); };
document.getElementById("reset").onclick = function(){
  try{ localStorage.removeItem("bost_url"); localStorage.removeItem("bost_key"); }catch(e){}
  load(); run();
};
document.getElementById("copy").onclick = function(){
  var t = document.getElementById("report").textContent, b = this;
  function done(){ b.textContent="Copiat"; setTimeout(function(){ b.textContent="Copiază raportul"; },1600); }
  function fb(){
    var ta=document.createElement("textarea"); ta.value=t;
    ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ b.textContent="Selectează textul de mai sus"; }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(done).catch(fb);
  else fb();
};

load();
run();
})();
</script>
</body>
</html>
